# Local services for development and tests. Not used in production — Supabase
# hosts Postgres, and Redis is provisioned separately.
services:
  postgres:
    # pgvector rather than plain postgres: migration 0001 creates the extension,
    # so a stock image cannot run our migrations.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bagsmarkets_test
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
